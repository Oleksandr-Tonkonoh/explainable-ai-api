name: CI

on:
  push:
    branches: 
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          python -m pytest -v

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t explainable-ai .

      - name: Run Docker container
        run: |
          docker run -d \
            --name explainable-ai-test \
            -p 8000:8000 \
            explainable-ai

      - name: Wait for API
        run: |
          sleep 5

      - name: Test API
        run: |
          curl --fail http://localhost:8000/docs

      - name: Stop Docker container
        if: always()
        run: |
          docker stop explainable-ai-test
      